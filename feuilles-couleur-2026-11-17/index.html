<h1>Les feuilles en couleur</h1><p class="meta">Captures de werup.app en production, sur iPhone, le 17/11 vers minuit.</p><figure><figcaption><b>Avant : la liste</b><span>Des cartes à bord 3D sur du noir uni.</span></figcaption><img src="images/0-avant-liste.jpg" alt="Avant : la liste" loading="lazy"></figure><figure><figcaption><b>Carburant, en jaune doré</b><span>La couleur de l&#x27;onglet sur toute la feuille ; le gazole par défaut.</span></figcaption><img src="images/1-carburant.jpg" alt="Carburant, en jaune doré" loading="lazy"></figure><figure><figcaption><b>La liste, sans bord 3D</b><span>Des aplats sombres posés sur la couleur.</span></figcaption><img src="images/2-liste.jpg" alt="La liste, sans bord 3D" loading="lazy"></figure><figure><figcaption><b>Espagne proche, en un toucher</b><span>Un seul bouton : la moins chère d&#x27;abord, la carte d&#x27;Argelès à Figueres.</span></figcaption><img src="images/3b-espagne.jpg" alt="Espagne proche, en un toucher" loading="lazy"></figure><figure><figcaption><b>En SP95-E10, l&#x27;Espagne passe seule au SP95</b><span>Elle ne vend pas d&#x27;E10 ; revenu en France, l&#x27;E10 revient.</span></figcaption><img src="images/4-espagne-liste.jpg" alt="En SP95-E10, l&#x27;Espagne passe seule au SP95" loading="lazy"></figure><figure><figcaption><b>Bornes, en bleu électrique</b><span>Chaque onglet prend la couleur de son repère sur la carte.</span></figcaption><img src="images/5-bornes.jpg" alt="Bornes, en bleu électrique" loading="lazy"></figure><figure><figcaption><b>Parkings, au bleu du « P »</b><span>Distinct des bornes.</span></figcaption><img src="images/6-parkings.jpg" alt="Parkings, au bleu du « P »" loading="lazy"></figure><figure><figcaption><b>Trafic, en vert sauge</b><span>La liste des signalements, sans bord 3D.</span></figcaption><img src="images/7-trafic-liste.jpg" alt="Trafic, en vert sauge" loading="lazy"></figure><figure><figcaption><b>La fiche d&#x27;une sortie</b><span>Sa page prend la couleur de son affiche.</span></figcaption><img src="images/8-fiche-0.jpg" alt="La fiche d&#x27;une sortie" loading="lazy"></figure></main></body></html>
