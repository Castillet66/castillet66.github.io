<h1>Les nouvelles cartes du Sport</h1><p class="meta">Captures de la vraie application en ligne (werup.app), iPhone Pro Max, le 17/11 à 22 h. <a href="https://werup.app/">Ouvrir Werup</a></p>
<figure><figcaption><b>L'accueil, en direct</b><span>Carte plus large, photo nue. La capsule « Football » dans la découpe. Le direct en orange, les scores dans la police de Werup.</span></figcaption><img src="images/01-accueil-440.jpg" alt="L'accueil, carte en direct"></figure>
<figure><figcaption><b>On fait glisser</b><span>« Rugby à XV » en bleu, « Football » en vert. Le jour d'abord, l'heure en petit. Le logo de la compétition en grand, sans rien sur les joueurs.</span></figcaption><img src="images/01b-accueil-france-440.jpg" alt="France – Argentine" loading="lazy"></figure>
<figure><figcaption><b>La page Sport</b><span>« À la une » prend la même carte, en grand. Tout est au vouvoiement : « Choisissez vos équipes ».</span></figcaption><img src="images/02-sport-440.jpg" alt="La page Sport" loading="lazy"></figure>
<figure><figcaption><b>La page de l'USAP</b><span>Les mêmes cartes pour ses matchs, le score en grand.</span></figcaption><img src="images/04-usap-440.jpg" alt="La page de l'USAP" loading="lazy"></figure>
