<h1>Les cartes du Sport, version 2</h1><p class="meta">Captures de la vraie application en ligne (werup.app), iPhone Pro Max, le 18/11 à 2 h. <a href="https://werup.app/">Ouvrir Werup</a></p>
<figure><figcaption><b>Le logo a sa propre découpe</b><span>En bas à droite, en miroir de la capsule. Entier, en grand, jamais sur les visages. Le score en face-à-face.</span></figcaption><img src="images/carte-0.jpg" alt="France – Argentine"></figure>
<figure><figcaption><b>Un résultat</b><span>« Terminé · Dim. 15 nov. », le score au milieu dans la police de Werup, le perdant en gris. La photo montre le vainqueur.</span></figcaption><img src="images/carte-1.jpg" alt="France 2 – 1 Turquie" loading="lazy"></figure>
<figure><figcaption><b>La Ligue 1 enfin entière</b><span>Sur sa plaque blanche, plus jamais coupée.</span></figcaption><img src="images/carte-2.jpg" alt="Lille – Lyon" loading="lazy"></figure>
<figure><figcaption><b>Sur un iPhone plus petit</b><span>Largeur d'un iPhone 6, 7 ou 8 : la carte suivante dépasse juste.</span></figcaption><img src="images/01-accueil-375.jpg" alt="Accueil à 375 px" loading="lazy"></figure>
<figure><figcaption><b>La page de l'USAP</b><span>La même carte pour ses matchs.</span></figcaption><img src="images/04-usap-440.jpg" alt="La page de l'USAP" loading="lazy"></figure>
