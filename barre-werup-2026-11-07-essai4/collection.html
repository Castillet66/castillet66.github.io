  <h1>Les six avatars</h1>
  <p>En carré arrondi, la forme décidée. Le Galet est la figure neutre par défaut ; les cinq autres sont de la famille du flâneur. <a href="barre.html">Les voir dans la barre →</a></p>
  <div class="grille">
    <figure><img src="avatars/galet-720.webp" alt=""><figcaption>Galet<span>l'accueil, par défaut — validé</span></figcaption></figure>
