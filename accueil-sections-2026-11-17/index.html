<h1>Les sections de l'accueil</h1><p class="meta">Captures de werup.app en production, sur iPhone, le 17/11 au soir.</p><figure><figcaption><b>Sans ville : « Choisissez votre ville »</b><span>Le haut de l&#x27;accueil ne change pas ; la capsule et les tuiles vouvoient.</span></figcaption><img src="images/iphone-16-sans-ville-haut.jpg" alt="Sans ville : « Choisissez votre ville »" loading="lazy"></figure><figure><figcaption><b>Sortir aujourd&#x27;hui</b><span>Dès 21 h, la section devient « Sortir demain » et montre les sorties de demain.</span></figcaption><img src="images/iphone-16-sortir-aujourd-hui.jpg" alt="Sortir aujourd&#x27;hui" loading="lazy"></figure><figure><figcaption><b>La route en sections : carburant, bornes, parkings</b><span>Chacune se choisit dans « Mon accueil » ; toucher une carte ouvre la station, la borne ou le parking.</span></figcaption><img src="images/iphone-16-le-carburant-le-moins-cher-p.jpg" alt="La route en sections : carburant, bornes, parkings" loading="lazy"></figure><figure><figcaption><b>Le trafic en direct</b><span>Les signalements autour de vous ; « Tout voir » ouvre la page Sur la route.</span></figcaption><img src="images/iphone-16-le-trafic-en-direct.jpg" alt="Le trafic en direct" loading="lazy"></figure><figure><figcaption><b>La recette du jour</b><span>La photo en grand, une section à elle.</span></figcaption><img src="images/iphone-16-la-recette-du-jour.jpg" alt="La recette du jour" loading="lazy"></figure><figure><figcaption><b>Votre horoscope</b><span>Le signe, et la phrase du jour au vouvoiement.</span></figcaption><img src="images/iphone-16-votre-horoscope.jpg" alt="Votre horoscope" loading="lazy"></figure><figure><figcaption><b>À l&#x27;affiche au cinéma</b><span>Une seule porte « Tout voir » par section.</span></figcaption><img src="images/iphone-16-a-l-affiche-au-cine-ma.jpg" alt="À l&#x27;affiche au cinéma" loading="lazy"></figure><figure><figcaption><b>Le sport à suivre</b><span></span></figcaption><img src="images/iphone-16-le-sport-a-suivre.jpg" alt="Le sport à suivre" loading="lazy"></figure><figure><figcaption><b>Le top streaming du moment</b><span>Un titre sur deux lignes garde « Tout voir » à droite.</span></figcaption><img src="images/iphone-16-le-top-streaming-du-moment.jpg" alt="Le top streaming du moment" loading="lazy"></figure><figure><figcaption><b>Sur un iPhone SE (320 px)</b><span>Le titre le plus long, sur trois lignes, propre.</span></figcaption><img src="images/iphone-se-le-carburant-le-moins-cher-p.jpg" alt="Sur un iPhone SE (320 px)" loading="lazy"></figure><figure><figcaption><b>Sur un Samsung Z Flip</b><span></span></figcaption><img src="images/z-flip-le-carburant-le-moins-cher-p.jpg" alt="Sur un Samsung Z Flip" loading="lazy"></figure><figure><figcaption><b>Sur un iPhone Pro Max</b><span></span></figcaption><img src="images/pro-max-le-carburant-le-moins-cher-p.jpg" alt="Sur un iPhone Pro Max" loading="lazy"></figure></main></body></html>
