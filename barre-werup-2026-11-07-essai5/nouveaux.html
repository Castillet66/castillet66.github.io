<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Les quatre nouveaux — Werup, essai n° 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  body { margin: 0; background: #0b0b0c; color: #fff; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 22px) 18px 40px; }
  h1 { font: 600 22px/1.25 Inter, sans-serif; margin: 0 0 6px; }
  h2 { font: 600 16px/1.3 Inter, sans-serif; margin: 30px 0 10px; }
  p { font: 400 14px/1.5 Inter, sans-serif; color: rgba(255,255,255,.72); margin: 0 0 18px; }
  .grille { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 14px; }
  figure { margin: 0; }
  figure img { display: block; width: 100%; aspect-ratio: 1; border-radius: 22%; }
  figcaption { margin-top: 8px; text-align: center; font: 600 16px/1.25 Inter, sans-serif; }
  figcaption span { display: block; font: 400 12.5px/1.4 Inter, sans-serif; color: rgba(255,255,255,.62); margin-top: 2px; }
  .neuf { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .neuf figure img { border-radius: 22%; }
  .neuf figcaption { font: 500 11px/1.25 Inter, sans-serif; margin-top: 5px; }
  a { color: #fff; }
</style>
</head>
<body>
<main>
  <h1>Les quatre nouveaux</h1>
  <p>Construits sur le modèle du corsaire : une tête compacte et colorée, distincte du fond, des éléments graphiques expressifs, des aplats propres. Une proposition par personnage. <a href="barre.html">Les voir dans la barre →</a></p>
  <div class="grille">
    <figure><img src="avatars/melomane-720.webp" alt=""><figcaption>Le mélomane<span>refait : la tête domine, arceau fin, coussinets proportionnés</span></figcaption></figure>
    <figure><img src="avatars/lunettes-vue-720.webp" alt=""><figcaption>Le lecteur<span>lunettes de vue à monture épaisse, verres clairs</span></figcaption></figure>
    <figure><img src="avatars/heroine-720.webp" alt=""><figcaption>L'héroïne<span>masque de héros, coiffure au carré</span></figcaption></figure>
    <figure><img src="avatars/chauve-souris-720.webp" alt=""><figcaption>Le héros chauve-souris<span>création originale : masque en ailes déployées, sans cagoule</span></figcaption></figure>
  </div>
  <h2>Les neuf ensemble</h2>
  <div class="neuf">
    <figure><img src="avatars/galet-720.webp" alt=""><figcaption>Galet</figcaption></figure>
    <figure><img src="avatars/flaneur-720.webp" alt=""><figcaption>Flâneur</figcaption></figure>
    <figure><img src="avatars/corsaire-720.webp" alt=""><figcaption>Corsaire</figcaption></figure>
    <figure><img src="avatars/heros-720.webp" alt=""><figcaption>Héros masqué</figcaption></figure>
    <figure><img src="avatars/lunettes-720.webp" alt=""><figcaption>Curieux</figcaption></figure>
    <figure><img src="avatars/melomane-720.webp" alt=""><figcaption>Mélomane</figcaption></figure>
    <figure><img src="avatars/lunettes-vue-720.webp" alt=""><figcaption>Lecteur</figcaption></figure>
    <figure><img src="avatars/heroine-720.webp" alt=""><figcaption>Héroïne</figcaption></figure>
    <figure><img src="avatars/chauve-souris-720.webp" alt=""><figcaption>Chauve-souris</figcaption></figure>
  </div>
</main>
</body>
</html>
