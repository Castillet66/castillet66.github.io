<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Introuvable — aperçus Pulse</title>
<style>:root{color-scheme:dark}body{margin:0;background:#111;color:#f4f2ee;font:16px/1.5 -apple-system,system-ui,sans-serif}main{max-width:640px;margin:0 auto;padding:40px 18px}a,button{color:#7fd8d0}
.retour{display:inline-flex;align-items:center;min-height:44px;margin:14px 0 6px;padding:0 18px;border-radius:999px;border:0;background:#f5f1ea;color:#16130f;font-family:inherit;font-weight:600;font-size:15px;line-height:1;cursor:pointer}p{color:#cfccc6}code{color:#e6c88f}</style></head>
<body><main>
<h1 id="titre">Cet aperçu n'existe pas, ou plus.</h1>
<p id="explication" hidden></p>
<p><button id="revenir" class="retour" type="button" hidden>← Revenir à la carte</button></p>
<p><a href="/">Tous les aperçus</a></p>
</main>
<script>
/* Une fiche absente de l'instantané statique d'« Autour de moi » mène ici (l'application ouvre
   /agenda/… ou /lieux/… quand une fiche ne se charge pas). On l'explique, et on rend la carte. */
(function () {
  var c = location.pathname;
  if (!/^\/(agenda|lieux)\//.test(c)) return;
  document.title = "Fiche hors de l'aperçu — aperçus Pulse";
  document.getElementById("titre").textContent = "Cette fiche n'est pas dans l'aperçu statique.";
  var e = document.getElementById("explication");
  e.hidden = false;
  e.textContent = "L'aperçu d'« Autour de moi » ne rejoue que les fiches enregistrées au moment de sa capture (autour d'Elne, de Perpignan et d'Argelès). Dans l'application réelle, cette fiche s'ouvrirait normalement.";
  var b = document.getElementById("revenir");
  b.hidden = false;
  b.addEventListener("click", function () {
    if (history.length > 1 && document.referrer.indexOf(location.origin) === 0) history.back();
    else location.href = "/autour/";
  });
})();
</script>
</body></html>
