<h1>Les titres, comparés</h1><p class="meta">Captures de l'accueil réel, sur iPhone, le 17/11.</p><figure><figcaption><b>1. Avant (la police sage)</b><span>Lisible, mais comme toutes les plateformes : rien ne dit « Werup ».</span></figcaption><img src="images/390-0-avant-a.jpg" alt="1. Avant (la police sage)" loading="lazy"></figure><figure><figcaption><b>2. Hier soir</b><span>Trop gros, les mots se collent : un bloc.</span></figcaption><img src="images/390-1-actuel-a.jpg" alt="2. Hier soir" loading="lazy"></figure><figure><figcaption><b>3. Réglée, EN LIGNE (ma recommandation)</b><span>Plus petite, lettres et mots ouverts : on lit mot par mot, et c&#x27;est encore le dessin du logo.</span></figcaption><img src="images/390-5-retenue-a.jpg" alt="3. Réglée, EN LIGNE (ma recommandation)" loading="lazy"></figure><figure><figcaption><b>3 bis. La même, sur un petit iPhone</b><span>Elle tient sur une ligne, à côté de « Tout voir ».</span></figcaption><img src="images/320-5-retenue-b.jpg" alt="3 bis. La même, sur un petit iPhone" loading="lazy"></figure><figure><figcaption><b>4. L&#x27;autre piste (non retenue)</b><span>La même voix en minuscules : très lisible, mais elle quitte les capitales du logo.</span></figcaption><img src="images/390-4-minuscules-a.jpg" alt="4. L&#x27;autre piste (non retenue)" loading="lazy"></figure></main></body></html>
